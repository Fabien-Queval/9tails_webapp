<!-- /connexion
     Carte centrée sur fond deep. Accessibilité :
     - chaque input a un <label for> relié par id (lu par les lecteurs d'écran,
       et cliquer le label donne le focus au champ) ;
     - autocomplete aide les gestionnaires de mots de passe ;
     - le placeholder n'est qu'un exemple, jamais le label. -->

<main class="min-h-screen flex items-center justify-center p-4">
  <form [formGroup]="formulaire" (ngSubmit)="onSubmit()"
        class="bg-surface rounded-md p-6 sm:p-8 w-full max-w-md flex flex-col gap-4">

    <h1 class="font-heading text-2xl text-accent text-center mb-2">Connexion</h1>

    <div class="flex flex-col gap-1">
      <label for="email" class="font-body text-ink">Email</label>
      <input id="email" type="email" formControlName="email"
             autocomplete="email" placeholder="vous@exemple.fr"
             class="bg-raised text-ink font-body rounded-md px-3 py-2" />
    </div>

    <div class="flex flex-col gap-1">
      <label for="password" class="font-body text-ink">Mot de passe</label>
      <input id="password" type="password" formControlName="password"
             autocomplete="current-password"
             class="bg-raised text-ink font-body rounded-md px-3 py-2" />
    </div>

    <button type="submit" [disabled]="formulaire.invalid"
            class="bg-accent hover:bg-accent-dim disabled:opacity-50 disabled:cursor-not-allowed
                   text-deep font-heading font-semibold rounded-md px-4 py-2 mt-2 transition-colors">
      Se connecter
    </button>

    <p class="font-body text-muted text-sm text-center">
      Pas encore de compte ?
      <a routerLink="/inscription" class="text-accent hover:underline">S'enregistrer</a>
    </p>
  </form>
</main>
